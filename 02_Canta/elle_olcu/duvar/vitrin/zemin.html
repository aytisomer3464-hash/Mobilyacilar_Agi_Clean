<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zemin / Gereçler</title>
  <style>
    :root {
      --marka: #e8e4dc;
      --aksiyon: #fb923c;
      --zemin: #2c3136;
      --panel: #1a1e22;
      --yazi: #e8e4dc;
      --cizgi: #3a4046;
      --dis: #2c3136;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font: 15px/1.5 Roboto, "Segoe UI", system-ui, sans-serif;
      background: var(--dis); color: var(--yazi);
    }
    .sahne {
      max-width: 440px; margin: 0 auto; min-height: 100dvh;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
      background: var(--zemin);
    }
    button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; width: 100%; margin-top: 8px; border: 0; border-radius: 12px;
      background: #3a4046; color: #e8e4dc; border: 1px solid #3a4046; font-weight: 800; font-size: 1rem; cursor: pointer;
    }
    button.geri {
      width: auto; min-width: 96px; margin: 0; padding: 0 18px;
      background: var(--panel); color: var(--marka); border: 1px solid var(--cizgi);
    }
    h1 { margin: 16px 0 12px; font-size: 1.15rem; color: var(--marka); }
    @media (min-width: 768px) and (max-width: 1023px) {
      .sahne { max-width: 820px; padding: 16px 24px calc(16px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (min-width: 1024px) {
      .sahne {
        max-width: none; width: 100%; min-height: 100dvh;
        padding: 16px 28px calc(16px + env(safe-area-inset-bottom, 0px));
      }
      .liste { width: 100%; max-width: 560px; }
    }
  </style>
</head>
<body>
  <div class="sahne">
    <button type="button" class="geri" id="geriBtn">Geri</button>
    <h1>Zemin / Gereçler</h1>
    <div class="liste">
      <button type="button" id="seramikBtn">Seramik</button>
      <button type="button" id="kapiBtn">Kapı</button>
      <button type="button" id="yerSifonuBtn">Yer sifonu</button>
      <button type="button" id="dolapAltiBtn">Dolap altı yükselti</button>
    </div>
  </div>
  <script>
    document.getElementById("geriBtn").addEventListener("click", function () {
      window.location.href = "./index.html";
    });
    document.getElementById("seramikBtn").addEventListener("click", function () {
      window.location.href = "./seramik.html";
    });
    document.getElementById("kapiBtn").addEventListener("click", function () {
      window.location.href = "./kapi.html";
    });
    document.getElementById("yerSifonuBtn").addEventListener("click", function () {
      window.location.href = "./yer_sifonu.html";
    });
    document.getElementById("dolapAltiBtn").addEventListener("click", function () {
      window.location.href = "./dolap_alti.html";
    });
  </script>
</body>
</html>

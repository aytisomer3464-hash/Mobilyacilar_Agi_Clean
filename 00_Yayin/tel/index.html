<!DOCTYPE html>
<html lang="tr">
<head>
<script src="./vitrin_kapi.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tel çizim</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
      background: #120c08;
      color: #f3e6d4;
    }
    .sahne { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .kutu {
      width: min(100%, 420px);
      padding: 36px 28px;
      border-radius: 24px;
      background: #1c1612;
      border: 1px solid #6b5338;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.45rem; }
    p { margin: 0 0 24px; color: #d2c0a8; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 12px;
      background: #c4a574;
      color: #1a120c;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="sahne">
    <div class="kutu">
      <h1>Tel çizim</h1>
      <p>Kapı açık. Motor iskelet; tuval yok. Bu sayfa diğer araçlardan ayrı.</p>
      <a href="/">Çantaya dön</a>
    </div>
  </div>
</body>
</html>

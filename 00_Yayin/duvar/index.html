    #adimRaf {
      display: none;
    }
    #adimRafKaydir {
      flex: 1; display: flex; align-items: center; gap: 8px;
      padding: 6px 16px 4px; overflow-x: auto; overflow-y: hidden;

    #adimRafAd {
      display: none; margin: 0; padding: 6px 16px 0;

    }
    #adimRaf.ince #adimRafAd { display: block; }
    #adimRaf.ince #adimRafKaydir {
      flex: 0 0 0; height: 0; min-height: 0; padding: 0; overflow: hidden;
      opacity: 0; transform: translateY(-10px); pointer-events: none;
    }
    #adimRaf.ince #adimRafIlerleme { margin: 4px 16px 6px; }
    #adimRafKaydir .adimRafKart {
      flex: 0 0 72px; width: 72px; height: 80px; margin: 0; padding: 6px 4px 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
      border-radius: 14px; border: 1px solid var(--cizgi);
      background: var(--zemin); color: var(--soluk);
      font-size: 11px; font-weight: 800; line-height: 1.1; text-align: center;
      pointer-events: auto; -webkit-user-select: none; user-select: none;

    #adimRafKaydir .adimRafKart.bitti { color: var(--yazi); border-color: var(--bitti); }

    #adimRafKaydir .adimRafKart.kilitli { opacity: 0.45; }
    #adimRafKaydir .adimRafKart svg { width: 24px; height: 24px; display: block; flex: 0 0 24px; }
    #adimRafKaydir .adimRafKart .ad { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #adimRafKaydir .adimRafKart .deger { font-size: var(--yazi-min); font-variant-numeric: tabular-nums; color: inherit; }
    #adimRafIlerleme {
      height: 3px; margin: 0 16px 6px; border-radius: 2px; background: var(--cizgi); overflow: hidden;
    }
    #adimRafIlerlemeDol {
      display: block; height: 100%; width: 0; background: var(--aksiyon);
      transition: width var(--sure-orta) ease;
    }
    @keyframes adimRafNefes {
      0%, 100% { transform: scale(1.06); }
      50% { transform: scale(1.12); }
    }
    @keyframes adimRafTitre {
      0%, 100% { transform: scale(1.06) translateX(0); }
      25% { transform: scale(1.06) translateX(-6px); }
      75% { transform: scale(1.06) translateX(6px); }
    }
    @keyframes adimRafDamga {
      0% { transform: scale(1.25) rotate(-8deg); }
      100% { transform: scale(1.06) rotate(0); }
    }
    @keyframes adimRafDogdu {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #adimRafKaydir .adimRafKart.simdi.nefes {
      animation: adimRafNefes var(--sure-uzun) ease 3;
    }
    #adimRafKaydir .adimRafKart.simdi.titrer {
      animation: adimRafTitre var(--sure-kisa) ease 2;
    }
    #adimRafKaydir .adimRafKart.simdi.damga {
      animation: adimRafDamga var(--sure-orta) ease 1;
    }
    #adimRafKaydir .adimRafKart.dogdu {
      animation: adimRafDogdu var(--sure-orta) ease 1;
    }

      #adimRafKaydir .adimRafKart.simdi { transform: none; box-shadow: none; }
      #adimRafKaydir { transition: none; }

      #adimRafKaydir .adimRafKart.titrer,
      #adimRafKaydir .adimRafKart.damga,
